spring:
  application:
    name: Locally-Engine

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  redis:
    url: rediss://:${REDIS_PASSWORD}@${REDIS_HOST}
    #    ssl: true
    #    host: ${REDIS_HOST}
    #    port: ${REDIS_PORT}
    #    password: ${REDIS_PASSWORD}

    cache:
      type: redis

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

feign:
  okhttp:
    enabled: true