spring:
  application:
    name: Locally-Engine

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
          connection:
            provider_disables_autocommit: true

  redis:
    url: rediss://:${REDIS_PASSWORD}@${REDIS_HOST}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 8
        min-idle: 2
    #    ssl: true
    #    host: ${REDIS_HOST}
    #    port: ${REDIS_PORT}
    #    password: ${REDIS_PASSWORD}

    cache:
      type: redis

server:
  port: 8080
  servlet:
    context-path: /
    compression:
      enabled: true
    http2:
      enabled: true

jwt:
  secret: ${JWT_SECRET}

feign:
  okhttp:
    enabled: true
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000

# Logging for MVP
logging:
  level:
    com.locally: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: OFF  # Turn OFF SQL logging in production
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Rate limiting configuration
app:
  rate-limit:
    enabled: false
    requests-per-minute: 1000
    cache-cleanup-interval: 300000
    cache-entry-ttl: 600000

  audit:
    enabled: true
    performance-monitoring: false